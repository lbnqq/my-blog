<section class="stat-section">
    <h2 class="stat-section__title">{{ title }}</h2>
    <div class="table-scroll">
        <table class="stat-table analytics-table">
            <thead><tr><th>分组</th><th class="num">推荐数</th><th class="num">反馈数</th><th class="num">覆盖率</th><th class="num">平均分</th><th class="num">好评率</th><th class="num">差评率</th></tr></thead>
            <tbody>{% for row in rows %}<tr><td><strong>{{ row.label }}</strong></td><td class="num">{{ row.total_count }}</td><td class="num">{{ row.feedback_count }}</td><td class="num">{{ row.coverage_rate|floatformat:1 }}%</td><td class="num"><strong>{{ row.average_rating|floatformat:2 }}</strong></td><td class="num"><span class="pct-tag pct-tag--high">{{ row.positive_rate|floatformat:1 }}%</span></td><td class="num"><span class="pct-tag pct-tag--low">{{ row.negative_rate|floatformat:1 }}%</span></td></tr>{% empty %}<tr><td colspan="7">暂无数据。</td></tr>{% endfor %}</tbody>
        </table>
    </div>
</section>
