<form class="admin-filters" method="get">
{% if show_period %}<label class="filter-group">时间<select class="filter-select" name="period"><option value="today" {% if filters.period == 'today' %}selected{% endif %}>今日</option><option value="7d" {% if filters.period == '7d' %}selected{% endif %}>近 7 日</option><option value="30d" {% if filters.period == '30d' %}selected{% endif %}>近 30 日</option><option value="all" {% if filters.period == 'all' %}selected{% endif %}>全部时间</option><option value="custom" {% if filters.period == 'custom' %}selected{% endif %}>自定义</option></select></label>{% endif %}
{% if show_category %}<label class="filter-group">分类<select class="filter-select" name="category"><option value="">全部分类</option>{% for code,label in category_labels.items %}<option value="{{ code }}" {% if filters.category == code %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>{% endif %}
{% if show_version %}<label class="filter-group">算法版本<select class="filter-select" name="version"><option value="">全部版本</option>{% for version in algorithm_versions %}<option value="{{ version }}" {% if filters.version == version %}selected{% endif %}>{{ version }}</option>{% endfor %}</select></label>{% endif %}
{% if show_user_type %}<label class="filter-group">用户类型<select class="filter-select" name="user_type"><option value="all">全部用户</option><option value="authenticated" {% if filters.user_type == 'authenticated' %}selected{% endif %}>登录用户</option><option value="guest" {% if filters.user_type == 'guest' %}selected{% endif %}>游客</option></select></label>{% endif %}
{% if show_year %}<label class="filter-group">年份<select class="filter-select" name="year"><option value="all">全部年份</option><option value="2020" {% if filters.year_range == '2020' %}selected{% endif %}>2020+</option><option value="2010" {% if filters.year_range == '2010' %}selected{% endif %}>2010–2019</option><option value="2000" {% if filters.year_range == '2000' %}selected{% endif %}>2000–2009</option><option value="1990" {% if filters.year_range == '1990' %}selected{% endif %}>1990–1999</option><option value="pre1990" {% if filters.year_range == 'pre1990' %}selected{% endif %}>1990 前</option></select></label>{% endif %}
{% if show_sort %}<label class="filter-group">排序<select class="filter-select" name="sort"><option value="recommendations">按推荐次数</option><option value="average_rating" {% if filters.sort == 'average_rating' %}selected{% endif %}>按平均反馈分</option><option value="coverage" {% if filters.sort == 'coverage' %}selected{% endif %}>按反馈覆盖率</option></select></label>{% endif %}
{% if filters.period == 'custom' %}<label class="filter-group">开始<input class="date-input" type="date" name="date_from" value="{{ filters.date_from|date:'Y-m-d' }}"></label><label class="filter-group">结束<input class="date-input" type="date" name="date_to" value="{{ filters.date_to|date:'Y-m-d' }}"></label><button class="btn" type="submit">应用</button>{% endif %}
</form>
