{% if page.paginator.num_pages > 1 %}<div class="admin-pagination"><span>第 {{ page.number }} / {{ page.paginator.num_pages }} 页，共 {{ page.paginator.count }} 条</span><div class="pagination-links">{% if page.has_previous %}<a class="page-link" href="?{{ query_string }}&page={{ page.previous_page_number }}">上一页</a>{% endif %}<span class="page-link is-active">{{ page.number }}</span>{% if page.has_next %}<a class="page-link" href="?{{ query_string }}&page={{ page.next_page_number }}">下一页</a>{% endif %}</div></div>{% endif %}
